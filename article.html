<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turf Dispatch Reader | Tadano Sho Revival</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared Sub-Pages Stylesheet -->
  <link rel="stylesheet" href="content-style.css">
</head>
<body>

  <!-- Top Return Button & Popout -->
  <div class="container pt-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <a href="news.html" class="nav-back-btn">
        <i class="bi bi-arrow-left"></i> Back to News &amp; Reports
      </a>
      <a id="popoutLink" href="#" target="_blank" class="popout-btn">
        <i class="bi bi-box-arrow-up-right"></i> Open in New Tab
      </a>
    </div>
  </div>

  <!-- Main Article Reader Frame -->
  <main class="container my-2" style="max-width: 950px;">
    
    <div class="reader-card" data-aos="fade-up">

      <!-- Loading State -->
      <div id="loadingIndicator" class="text-center py-5">
        <div class="spinner-border text-danger mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <div class="text-muted small">Loading document dispatch...</div>
      </div>

      <!-- Native Embedded Document Frame -->
      <div id="frameWrapper" class="doc-frame-wrapper d-none">
        <iframe id="docFrame" src="about:blank" onload="onFrameLoad()"></iframe>
      </div>

      <!-- Error State -->
      <div id="errorState" class="text-center py-5 d-none">
        <i class="bi bi-journal-x fs-1 text-danger d-block mb-3"></i>
        <h4 class="fw-bold mb-2">No Article Specified</h4>
        <p class="text-muted small">Please choose an article from the News &amp; Reports page.</p>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      Tadano Sho &copy; 2026. All Rights Reserved. Not affiliated with Cygames.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <!-- Shared Sub-Pages Script -->
  <script src="content-script.js"></script>
</body>
</html>
