<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turf Dispatch Reader | Tadano Sho Revival</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Google Fonts: Cinzel, Rajdhani, Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070002;
      --card-bg: rgba(18, 5, 8, 0.95);
      --card-red-border: #dc2626;
      --neon-red: #ff1a2a;
      --accent-gold: #f5c518;
      --accent-gold-glow: rgba(245, 197, 24, 0.25);
      --text-muted: #a38c92;
      --text-body: #e2e8f0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-body);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.35), transparent 75%),
        radial-gradient(circle at 15% 25%, rgba(185, 28, 28, 0.15), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(245, 197, 24, 0.08), transparent 45%);
      background-attachment: fixed;
    }

    /* Top Return Button */
    .nav-back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(220, 38, 38, 0.35);
      border-radius: 20px;
    }
    .nav-back-btn:hover {
      color: #fff;
      border-color: var(--neon-red);
      background: rgba(220, 38, 38, 0.15);
      transform: translateX(-2px);
    }

    /* Red Frame Card Reader */
    .reader-card {
      background: var(--card-bg);
      border: 3px solid var(--card-red-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 0 35px rgba(185, 28, 28, 0.3);
      position: relative;
    }
    @media (max-width: 768px) {
      .reader-card {
        padding: 24px 18px;
      }
    }

    /* ----------------------------------------------------
       ARTICLE TYPOGRAPHY OVERRIDES
       (Forces imported Google Docs to match our Dark Theme)
    ---------------------------------------------------- */
    .article-body {
      font-size: 1.08rem;
      line-height: 1.85;
      color: var(--text-body) !important;
    }

    /* Strip inline colors & fonts generated by Google Docs */
    .article-body p, 
    .article-body span, 
    .article-body li,
    .article-body div {
      font-family: 'Inter', sans-serif !important;
      background-color: transparent !important;
    }

    .article-body p {
      margin-bottom: 1.25rem;
    }

    /* Headings */
    .article-body h1, 
    .article-body h2, 
    .article-body h3, 
    .article-body h4 {
      font-family: 'Cinzel', serif !important;
      color: var(--accent-gold) !important;
      font-weight: 800;
      margin-top: 2rem;
      margin-bottom: 1rem;
      line-height: 1.35;
      text-shadow: 0 0 15px rgba(245, 197, 24, 0.2);
    }
    .article-body h1 { font-size: 2.2rem; }
    .article-body h2 { font-size: 1.7rem; border-bottom: 1px solid rgba(220, 38, 38, 0.3); padding-bottom: 6px; }
    .article-body h3 { font-size: 1.35rem; }

    /* Links */
    .article-body a {
      color: #ff4d6d !important;
      text-decoration: underline;
      transition: color 0.2s ease;
    }
    .article-body a:hover {
      color: var(--accent-gold) !important;
    }

    /* Images */
    .article-body img {
      max-width: 100% !important;
      height: auto !important;
      border-radius: 12px;
      margin: 20px auto;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    /* Lists */
    .article-body ul, .article-body ol {
      padding-left: 2rem;
      margin-bottom: 1.5rem;
    }
    .article-body li {
      margin-bottom: 0.5rem;
    }

    /* Blockquotes / Highlights */
    .article-body blockquote {
      border-left: 4px solid var(--neon-red);
      padding: 12px 20px;
      margin: 20px 0;
      background: rgba(220, 38, 38, 0.1);
      border-radius: 0 12px 12px 0;
      font-style: italic;
      color: #fce7f3 !important;
    }

    /* Tables (if present in Doc) */
    .article-body table {
      width: 100% !important;
      margin: 20px 0;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
    }
    .article-body td, .article-body th {
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      padding: 10px 14px;
      color: var(--text-body) !important;
    }
    .article-body th {
      background: rgba(220, 38, 38, 0.2) !important;
      color: var(--accent-gold) !important;
      font-weight: 700;
    }

    /* Fallback iframe container if direct proxy fails */
    .fallback-iframe {
      width: 100%;
      height: 75vh;
      border: 2px solid rgba(220, 38, 38, 0.4);
      border-radius: 12px;
      background: #fff;
    }

    /* Footer */
    footer {
      background: #000;
      padding: 24px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 80px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Return Link -->
  <div class="container pt-4">
    <a href="news.html" class="nav-back-btn">
      <i class="bi bi-arrow-left"></i> Back to News &amp; Reports
    </a>
  </div>

  <!-- Main Article Container -->
  <main class="container my-4" style="max-width: 900px;">
    
    <div class="reader-card" data-aos="fade-up">

      <!-- Loading State -->
      <div id="loadingIndicator" class="text-center py-5">
        <div class="spinner-border text-danger mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <div class="text-muted small">Fetching turf dispatch from Google Docs...</div>
      </div>

      <!-- Error State -->
      <div id="errorState" class="text-center py-5 d-none">
        <i class="bi bi-exclamation-triangle fs-1 text-danger d-block mb-3"></i>
        <h4 class="fw-bold mb-2">Could Not Render Article</h4>
        <p class="text-muted small mb-4">The Google Doc link may not be published to the web or was temporarily blocked.</p>
        <div id="fallbackAction"></div>
      </div>

      <!-- Injected Article Content Body -->
      <article id="articleContent" class="article-body d-none">
        <!-- Rendered dynamically -->
      </article>

    </div>

  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      Tadano Sho &copy; 2026. All Rights Reserved. Not affiliated with Cygames.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    AOS.init({ duration: 500, once: true });

    // Read ?doc= URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const docUrl = urlParams.get('doc');

    const loader = document.getElementById('loadingIndicator');
    const contentBox = document.getElementById('articleContent');
    const errorBox = document.getElementById('errorState');
    const fallbackBox = document.getElementById('fallbackAction');

    if (!docUrl || docUrl.trim() === '') {
      loader.classList.add('d-none');
      errorBox.classList.remove('d-none');
      errorBox.querySelector('h4').innerText = "No Article Specified";
      errorBox.querySelector('p').innerText = "Please select an article from the news page.";
    } else {
      loadArticle(decodeURIComponent(docUrl.trim()));
    }

    function loadArticle(targetUrl) {
      // Using AllOrigins CORS Proxy to fetch raw Google Doc HTML
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      fetch(proxyUrl)
        .then(res => {
          if (!res.ok) throw new Error("Network response was not ok");
          return res.text();
        })
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          // Google Docs web pages place content inside #contents or body
          const contents = doc.querySelector('#contents') || doc.body;

          // Strip Google Docs default header/footer metadata banners
          const unwantedHeader = contents.querySelector('#header');
          if (unwantedHeader) unwantedHeader.remove();
          const unwantedFooter = contents.querySelector('#footer');
          if (unwantedFooter) unwantedFooter.remove();

          // Inject content
          contentBox.innerHTML = contents.innerHTML;

          loader.classList.add('d-none');
          contentBox.classList.remove('d-none');
        })
        .catch(err => {
          console.error("CORS fetch failed, providing embed fallback:", err);
          loader.classList.add('d-none');
          errorBox.classList.remove('d-none');

          // Provide direct iframe embed or open-link fallback
          fallbackBox.innerHTML = `
            <a href="${targetUrl}" target="_blank" class="btn btn-outline-warning rounded-pill px-4 mb-3">
              <i class="bi bi-box-arrow-up-right me-1"></i> Open Original Document
            </a>
            <div class="mt-4 text-start">
              <div class="small text-muted mb-2 text-center">Or read via embedded frame:</div>
              <iframe src="${targetUrl}" class="fallback-iframe"></iframe>
            </div>
          `;
        });
    }
  </script>
</body>
</html>
