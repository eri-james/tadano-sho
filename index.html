<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tadano Sho Revival | Grand Prix Standings</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- AOS (Animate On Scroll) for slick motion graphics -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Google Fonts (Cinzel for prestige & Rajdhani for sports numbers) -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: #121722;
      --accent-gold: #f5c518;
      --accent-gold-glow: rgba(245, 197, 24, 0.25);
      --accent-cyan: #00e5ff;
      --accent-magenta: #ff007f;
      --text-muted: #8e9bb0;
    }

    body {
      background-color: var(--bg-dark);
      color: #e9ecef;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(20, 30, 55, 0.8), transparent 70%),
        radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.05), transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(0, 229, 255, 0.05), transparent 40%);
      background-attachment: fixed;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 20%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-brand {
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Division Toggle Pills */
    .division-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #bbb;
      border-radius: 30px;
      padding: 10px 28px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .division-pill:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .division-pill.active {
      background: linear-gradient(135deg, #1e283d, #253350);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-gold-glow);
    }

    /* Podium Cards */
    .podium-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .podium-card:hover {
      transform: translateY(-6px);
    }

    .podium-1 {
      border-color: rgba(245, 197, 24, 0.5);
      box-shadow: 0 0 25px rgba(245, 197, 24, 0.15);
    }
    .podium-2 {
      border-color: rgba(200, 210, 225, 0.3);
    }
    .podium-3 {
      border-color: rgba(205, 127, 50, 0.3);
    }

    .podium-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    .podium-1 .podium-avatar { border-color: var(--accent-gold); }
    .podium-2 .podium-avatar { border-color: #cbd5e1; }
    .podium-3 .podium-avatar { border-color: #cd7f32; }

    .podium-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .score-num {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
    }

    /* Standings Table */
    .custom-table {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .custom-table table {
      margin-bottom: 0;
    }
    .custom-table th {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px;
    }
    .custom-table td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding: 16px;
      vertical-align: middle;
    }
    .rank-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      background: rgba(255, 255, 255, 0.06);
    }
    .rank-1 { background: var(--accent-gold); color: #000; }
    .rank-2 { background: #cbd5e1; color: #000; }
    .rank-3 { background: #cd7f32; color: #fff; }

    /* Animated Motion */
    .fade-content {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Hero Bar -->
  <div class="container py-5 text-center" data-aos="fade-down">
    <div class="sub-brand mb-1">Seasonal Grand Prix Revival</div>
    <h1 class="brand-title display-4 fw-bolder mb-2">只野賞 TADANO SHO</h1>
    <p class="text-secondary small">Asynchronous League Circuit &bull; 2026 Season</p>

    <!-- Division Switcher -->
    <div class="d-flex justify-content-center gap-3 my-4">
      <button class="btn division-pill active" onclick="switchDivision('Graded')">
        <i class="bi bi-trophy-fill me-2 text-warning"></i>Graded Division
      </button>
      <button class="btn division-pill" onclick="switchDivision('Open')">
        <i class="bi bi-shield-check me-2 text-info"></i>Open Division (UC Capped)
      </button>
    </div>
  </div>

  <div class="container pb-5">
    <!-- Top 3 Podium (Populated by JS) -->
    <div class="row g-4 justify-content-center mb-5 align-items-end" id="podiumContainer" data-aos="fade-up">
      <!-- Generated Dynamically -->
    </div>

    <!-- Complete Standings Table -->
    <div class="custom-table" data-aos="fade-up" data-aos-delay="150">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
          <thead>
            <tr>
              <th class="text-center" style="width: 80px;">Rank</th>
              <th>Trainer</th>
              <th class="text-center">Points</th>
              <th class="text-center">Wins</th>
              <th class="text-center">Podiums</th>
              <th class="text-center">Races</th>
              <th class="text-center">Avg Pos</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Generated Dynamically -->
          </tbody>
        </table>
      </div>
    </div>
    
    <div class="text-center text-muted small mt-4">
      Races update automatically &bull; Powered by Google Sheets
    </div>
  </div>

  <!-- PapaParse for Google Sheets CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- AOS Animation Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  
  <script>
    // Initialize AOS Motion Graphics
    AOS.init({ duration: 600, once: true });

    // ========================================================
    // 1. PUT YOUR GOOGLE SHEET CSV URL HERE!
    // ========================================================
    // To get this link: File -> Share -> Publish to web -> Choose CSV format
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbkE2wbV5LWkVIGXpJGdbSG9LxUopGIXMuOjyt5w0fkb3olKb6ueMyDWH3hFiS6tbdQfQv5VZdMct3/pub?gid=0&single=true&output=csv"; 

    // Fallback Mock Data (so the page displays immediately if Sheet URL is blank)
    const MOCK_DATA = [
      { Trainer: "Aikawa", Division: "Graded", Points: 38, Wins: 2, Podiums: 5, Races: 5, Avg_Pos: 1.6, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Aikawa" },
      { Trainer: "HikariNoSora34", Division: "Graded", Points: 37, Wins: 2, Podiums: 5, Races: 6, Avg_Pos: 2.33, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Hikari" },
      { Trainer: "Hez Azuryn", Division: "Graded", Points: 36, Wins: 2, Podiums: 5, Races: 6, Avg_Pos: 2.33, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Hez" },
      { Trainer: "ewidaria", Division: "Graded", Points: 21, Wins: 0, Podiums: 3, Races: 7, Avg_Pos: 3.57, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=ewidaria" },
      { Trainer: "Erron", Division: "Graded", Points: 19, Wins: 1, Podiums: 3, Races: 4, Avg_Pos: 3.0, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Erron" },
      { Trainer: "nyumpoi", Division: "Graded", Points: 2, Wins: 0, Podiums: 0, Races: 1, Avg_Pos: 4.0, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=nyumpoi" },
      { Trainer: "Ricky", Division: "Graded", Points: 1, Wins: 0, Podiums: 0, Races: 1, Avg_Pos: 6.0, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Ricky" },

      { Trainer: "HikariNoSora34", Division: "Open", Points: 52, Wins: 4, Podiums: 6, Races: 6, Avg_Pos: 1.33, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Hikari" },
      { Trainer: "Aikawa", Division: "Open", Points: 32, Wins: 1, Podiums: 5, Races: 5, Avg_Pos: 2.0, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Aikawa" },
      { Trainer: "Hez Azuryn", Division: "Open", Points: 28, Wins: 2, Podiums: 3, Races: 4, Avg_Pos: 2.0, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Hez" },
      { Trainer: "ewidaria", Division: "Open", Points: 18, Wins: 0, Podiums: 3, Races: 7, Avg_Pos: 3.86, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=ewidaria" },
      { Trainer: "Erron", Division: "Open", Points: 11, Wins: 0, Podiums: 1, Races: 4, Avg_Pos: 3.75, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Erron" },
      { Trainer: "Ricky", Division: "Open", Points: 8, Wins: 0, Podiums: 2, Races: 2, Avg_Pos: 3.0, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Ricky" },
      { Trainer: "nyumpoi", Division: "Open", Points: 4, Wins: 0, Podiums: 1, Races: 1, Avg_Pos: 3.0, Avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=nyumpoi" }
    ];

    let fullData = [];
    let currentDivision = 'Graded';

    // Fetch and Load Data
    async function init() {
      if (GOOGLE_SHEET_CSV_URL && GOOGLE_SHEET_CSV_URL.trim() !== "") {
        Papa.parse(GOOGLE_SHEET_CSV_URL, {
          download: true,
          header: true,
          dynamicTyping: true,
          complete: function(results) {
            fullData = results.data.filter(row => row.Trainer);
            render();
          },
          error: function(err) {
            console.warn("Could not load Google Sheet, loading fallback data", err);
            fullData = MOCK_DATA;
            render();
          }
        });
      } else {
        fullData = MOCK_DATA;
        render();
      }
    }

    function switchDivision(div) {
      currentDivision = div;
      document.querySelectorAll('.division-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(div));
      });
      render();
    }

    function render() {
      const container = document.getElementById('podiumContainer');
      const tableBody = document.getElementById('tableBody');

      // Filter and Sort Data by Points
      const filtered = fullData
        .filter(r => (r.Division || '').toLowerCase() === currentDivision.toLowerCase())
        .sort((a, b) => (b.Points || 0) - (a.Points || 0));

      // 1. Render Top 3 Podium (2nd, 1st, 3rd display order)
      const top1 = filtered[0];
      const top2 = filtered[1];
      const top3 = filtered[2];

      container.className = "row g-4 justify-content-center mb-5 align-items-end fade-content";
      container.innerHTML = `
        <!-- 2nd Place -->
        ${top2 ? `
        <div class="col-md-4 col-sm-6 order-2 order-md-1">
          <div class="podium-card podium-2 p-4 text-center">
            <span class="podium-badge bg-secondary mb-3 d-inline-block text-dark">2nd Place</span>
            <img src="${top2.Avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + top2.Trainer}" class="podium-avatar mb-3 d-block mx-auto">
            <h5 class="fw-bold mb-1">${top2.Trainer}</h5>
            <div class="score-num text-light my-2">${top2.Points} <small class="fs-6 text-muted">pts</small></div>
            <div class="text-secondary small">${top2.Wins || 0} wins &bull; ${top2.Podiums || 0} podiums</div>
          </div>
        </div>` : ''}

        <!-- 1st Place (Center / Taller) -->
        ${top1 ? `
        <div class="col-md-4 col-sm-6 order-1 order-md-2">
          <div class="podium-card podium-1 p-4 pb-5 text-center">
            <span class="podium-badge bg-warning mb-3 d-inline-block text-dark"><i class="bi bi-crown-fill me-1"></i> Leader</span>
            <img src="${top1.Avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + top1.Trainer}" class="podium-avatar mb-3 d-block mx-auto shadow-lg">
            <h4 class="fw-bold mb-1 text-warning">${top1.Trainer}</h4>
            <div class="score-num text-warning my-2">${top1.Points} <small class="fs-6 text-warning-emphasis">pts</small></div>
            <div class="text-secondary small">${top1.Wins || 0} wins &bull; ${top1.Podiums || 0} podiums</div>
          </div>
        </div>` : ''}

        <!-- 3rd Place -->
        ${top3 ? `
        <div class="col-md-4 col-sm-6 order-3 order-md-3">
          <div class="podium-card podium-3 p-4 text-center">
            <span class="podium-badge bg-dark border border-secondary mb-3 d-inline-block text-light">3rd Place</span>
            <img src="${top3.Avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + top3.Trainer}" class="podium-avatar mb-3 d-block mx-auto">
            <h5 class="fw-bold mb-1">${top3.Trainer}</h5>
            <div class="score-num text-light my-2">${top3.Points} <small class="fs-6 text-muted">pts</small></div>
            <div class="text-secondary small">${top3.Wins || 0} wins &bull; ${top3.Podiums || 0} podiums</div>
          </div>
        </div>` : ''}
      `;

      // 2. Render Table Rows
      tableBody.className = "fade-content";
      tableBody.innerHTML = filtered.map((row, index) => {
        const rank = index + 1;
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
        return `
          <tr>
            <td class="text-center">
              <span class="rank-circle ${rankClass}">${rank}</span>
            </td>
            <td>
              <div class="d-flex align-items-center gap-3">
                <img src="${row.Avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + row.Trainer}" width="32" height="32" class="rounded-circle">
                <span class="fw-bold">${row.Trainer}</span>
              </div>
            </td>
            <td class="text-center fw-bold text-warning fs-5">${row.Points || 0}</td>
            <td class="text-center text-secondary">${row.Wins || 0}</td>
            <td class="text-center text-secondary">${row.Podiums || 0}</td>
            <td class="text-center text-secondary">${row.Races || 0}</td>
            <td class="text-center text-secondary">${row.Avg_Pos ? Number(row.Avg_Pos).toFixed(2) : '-'}</td>
          </tr>
        `;
      }).join('');
    }

    // Run on load
    init();
  </script>
</body>
</html>
