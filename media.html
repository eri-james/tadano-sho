<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Archives | Tadano Sho Revival</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Google Fonts: Cinzel, Rajdhani, Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070002;
      --card-bg: rgba(18, 5, 8, 0.92);
      --card-red-border: #dc2626;
      --neon-red: #ff1a2a;
      --accent-gold: #f5c518;
      --accent-gold-glow: rgba(245, 197, 24, 0.25);
      --text-muted: #a38c92;
    }

    body {
      background-color: var(--bg-dark);
      color: #fce7f3;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.35), transparent 75%),
        radial-gradient(circle at 10% 20%, rgba(185, 28, 28, 0.15), transparent 45%),
        radial-gradient(circle at 90% 20%, rgba(245, 197, 24, 0.08), transparent 45%);
      background-attachment: fixed;
    }

    /* Top Return Button */
    .nav-back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(220, 38, 38, 0.35);
      border-radius: 20px;
    }
    .nav-back-btn:hover {
      color: #fff;
      border-color: var(--neon-red);
      background: rgba(220, 38, 38, 0.15);
      transform: translateX(-2px);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ffffff 15%, #ff4d6d 60%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 26, 42, 0.3);
    }

    .sub-brand {
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: var(--neon-red);
      text-transform: uppercase;
      font-weight: 800;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Category Filter Pills (Matches Standings/Index Style) */
    .filter-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #cbd5e1;
      border-radius: 30px;
      padding: 8px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      font-family: 'Rajdhani', sans-serif;
      text-transform: uppercase;
    }
    .filter-pill:hover {
      color: #fff;
      border-color: var(--neon-red);
      background: rgba(220, 38, 38, 0.15);
    }
    .filter-pill.active {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border-color: var(--neon-red);
      color: #fff;
      box-shadow: 0 0 16px rgba(255, 26, 42, 0.5);
    }

    /* Media Cards Grid */
    .media-card {
      background: var(--card-bg);
      border: 2px solid rgba(220, 38, 38, 0.3);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .media-card:hover {
      transform: translateY(-6px);
      border-color: var(--neon-red);
      box-shadow: 0 0 25px rgba(255, 26, 42, 0.4);
      color: inherit;
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }
    .media-card:hover .thumbnail-container img {
      transform: scale(1.05);
    }

    .media-play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      color: rgba(255, 255, 255, 0.85);
      transition: all 0.2s ease;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
    }
    .media-card:hover .media-play-overlay {
      color: var(--accent-gold);
      transform: translate(-50%, -50%) scale(1.15);
    }

    .category-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(7, 0, 2, 0.88);
      border: 1px solid rgba(245, 197, 24, 0.6);
      color: var(--accent-gold);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
      z-index: 2;
    }
    .badge-races { border-color: rgba(255, 26, 42, 0.7); color: #ff758f; }
    .badge-show  { border-color: rgba(168, 85, 247, 0.7); color: #d8b4fe; }
    .badge-guide { border-color: rgba(0, 229, 255, 0.7); color: #67e8f9; }

    .card-body-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .media-item-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .media-card:hover .media-item-title {
      color: var(--accent-gold);
    }
    .media-item-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Red Frame Surrounding Box */
    .red-frame-box {
      background: var(--card-bg);
      border: 3px solid var(--card-red-border);
      border-radius: 22px;
      padding: 30px;
      position: relative;
      box-shadow: 0 0 30px rgba(185, 28, 28, 0.25);
    }

    /* Motion */
    .fade-content {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    footer {
      background: #000;
      padding: 24px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Return Link -->
  <div class="container pt-4">
    <a href="index.html" class="nav-back-btn">
      <i class="bi bi-arrow-left"></i> Grand Prix Hub
    </a>
  </div>

  <!-- Hero Header -->
  <div class="container py-4 text-center" data-aos="fade-down">
    <div class="sub-brand mb-1">Broadcasts &amp; Recordings</div>
    <h1 class="brand-title display-4 fw-bolder mb-2">MEDIA ARCHIVES</h1>
    <p class="text-secondary small mb-4">Official race replays, post-classic talk shows, and strategy guides.</p>

    <!-- Category Filter Pills -->
    <div class="d-flex justify-content-center gap-2 flex-wrap mb-4" id="categoryFilters">
      <button class="btn filter-pill active" onclick="filterCategory('ALL')">
        <i class="bi bi-collection-play me-1"></i> All Media
      </button>
      <button class="btn filter-pill" onclick="filterCategory('Past Races')">
        <i class="bi bi-flag-fill me-1 text-danger"></i> Past Races
      </button>
      <button class="btn filter-pill" onclick="filterCategory('After Classics')">
        <i class="bi bi-mic-fill me-1 text-info"></i> After Classics
      </button>
      <button class="btn filter-pill" onclick="filterCategory('Guides')">
        <i class="bi bi-journal-bookmark-fill me-1 text-warning"></i> Guides
      </button>
    </div>
  </div>

  <!-- Main Media Gallery Grid -->
  <div class="container pb-5">
    <div class="red-frame-box" data-aos="fade-up" data-aos-delay="100">
      
      <!-- Loading State -->
      <div id="loadingIndicator" class="text-center py-5">
        <div class="spinner-border text-danger mb-2" role="status"></div>
        <div class="text-muted small">Loading media archives from Google Sheets...</div>
      </div>

      <!-- Video Grid -->
      <div class="row g-4 fade-content" id="mediaGallery">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      Tadano Sho &copy; 2026. All Rights Reserved. Not affiliated with Cygames.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    AOS.init({ duration: 500, once: true });

    // Live Media CSV URL
    const MEDIA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS08jJrOzuXOjKwhtpfvUq55UaYJgYfq8bBmrWh4yjk_7ZoehVhZ_WtEa2eWrwhZ8zqHWR_rD3quKCA/pub?gid=0&single=true&output=csv";

    let allMediaData = [];
    let currentCategory = 'ALL';

    // Helper: Extract YouTube Thumbnail if none provided
    function getYoutubeThumbnail(url, fallbackThumb) {
      if (fallbackThumb && fallbackThumb.trim() !== '') {
        return fallbackThumb.trim();
      }
      if (!url) return 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600';
      
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        return `https://img.youtube.com/vi/${match[2]}/hqdefault.jpg`;
      }
      return 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600';
    }

    // Helper: Category badge class
    function getCategoryBadgeClass(cat) {
      const c = (cat || '').toLowerCase();
      if (c.includes('race')) return 'badge-races';
      if (c.includes('classic') || c.includes('show')) return 'badge-show';
      if (c.includes('guide')) return 'badge-guide';
      return '';
    }

    // Fetch Media CSV
    function loadMedia() {
      const loader = document.getElementById('loadingIndicator');
      loader.classList.remove('d-none');

      Papa.parse(MEDIA_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          loader.classList.add('d-none');

          allMediaData = (res.data || [])
            .filter(item => item.Title && String(item.Title).trim() !== "")
            .map(item => ({
              Title: String(item.Title).trim(),
              Category: String(item.Category || 'Media').trim(),
              YouTube_URL: String(item.YouTube_URL || '').trim(),
              Thumbnail_URL: item.Thumbnail_URL ? String(item.Thumbnail_URL).trim() : '',
              Date: item.Date ? String(item.Date).trim() : ''
            }));

          renderGallery();
        },
        error: function(err) {
          loader.classList.add('d-none');
          console.error("Failed to load media CSV:", err);
          document.getElementById('mediaGallery').innerHTML = `
            <div class="col-12 text-center text-muted py-5">
              <i class="bi bi-exclamation-circle fs-2 d-block mb-2 text-danger"></i>
              Could not load media feed from Google Sheets.
            </div>`;
        }
      });
    }

    // Filter Category
    function filterCategory(category) {
      currentCategory = category;

      // Update button active states
      document.querySelectorAll('#categoryFilters .filter-pill').forEach(btn => {
        if (category === 'ALL') {
          btn.classList.toggle('active', btn.innerText.includes('All Media'));
        } else {
          btn.classList.toggle('active', btn.innerText.toLowerCase().includes(category.toLowerCase()));
        }
      });

      renderGallery();
    }

    // Render Cards
    function renderGallery() {
      const gallery = document.getElementById('mediaGallery');

      const filtered = allMediaData.filter(item => {
        if (currentCategory === 'ALL') return true;
        return item.Category.toLowerCase() === currentCategory.toLowerCase();
      });

      if (filtered.length === 0) {
        gallery.innerHTML = `
          <div class="col-12 text-center text-muted py-5">
            <i class="bi bi-film fs-2 d-block mb-2"></i>
            No media found under "${currentCategory}".
          </div>`;
        return;
      }

      gallery.innerHTML = filtered.map(m => {
        const thumb = getYoutubeThumbnail(m.YouTube_URL, m.Thumbnail_URL);
        const link = m.YouTube_URL || '#';
        const badgeClass = getCategoryBadgeClass(m.Category);

        return `
          <div class="col-md-6 col-lg-4">
            <a href="${link}" target="_blank" class="media-card">
              <div class="thumbnail-container">
                <span class="category-tag ${badgeClass}">${m.Category}</span>
                <img src="${thumb}" alt="${m.Title}" loading="lazy">
                <i class="bi bi-play-circle-fill media-play-overlay"></i>
              </div>
              <div class="card-body-content">
                <div class="media-item-title">${m.Title}</div>
                <div class="media-item-date">
                  <i class="bi bi-calendar3"></i> ${m.Date || '2026'}
                </div>
              </div>
            </a>
          </div>
        `;
      }).join('');
    }

    // Initial Load
    loadMedia();
  </script>
</body>
</html>
