<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phantom Sprint 2026 | Tadano Sho Revival</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- AOS (Animate On Scroll) -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Google Fonts: Cinzel, Rajdhani, Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #09030a;
      --card-bg: rgba(22, 10, 28, 0.82);
      --accent-red: #e6194b;
      --accent-crimson: #9e0b2e;
      --accent-purple: #7b1fa2;
      --accent-glow-red: rgba(230, 25, 75, 0.28);
      --accent-gold: #f5c518;
      --text-muted: #a792ab;
    }

    body {
      background-color: var(--bg-dark);
      color: #f1e9f3;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(90, 10, 50, 0.7), transparent 75%),
        radial-gradient(circle at 15% 25%, rgba(158, 11, 46, 0.15), transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(123, 31, 162, 0.18), transparent 50%);
      background-attachment: fixed;
    }

    /* Minimal Speed Particles Canvas */
    #speedCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 2.5px;
      background: linear-gradient(135deg, #ffffff 10%, #ff4d6d 55%, #c77dff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(230, 25, 75, 0.4);
    }

    .sub-brand {
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: #ff4d6d;
      text-transform: uppercase;
      font-weight: 700;
    }

    .nav-back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 77, 109, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(6px);
    }
    .nav-back-btn:hover {
      color: #fff;
      border-color: var(--accent-red);
      background: rgba(230, 25, 75, 0.15);
      transform: translateX(-2px);
    }

    /* Server Toggle Buttons */
    .server-pill {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 77, 109, 0.25);
      color: #cbd5e1;
      border-radius: 30px;
      padding: 8px 22px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
    }
    .server-pill:hover {
      color: #fff;
      border-color: #ff4d6d;
    }
    .server-pill.active {
      background: linear-gradient(135deg, #b91c1c, #831843);
      border-color: #ff4d6d;
      color: #fff;
      box-shadow: 0 0 16px rgba(230, 25, 75, 0.45);
    }

    /* Division Switcher Buttons */
    .division-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(157, 78, 221, 0.25);
      color: #cbd5e1;
      border-radius: 30px;
      padding: 10px 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }
    .division-pill:hover {
      color: #fff;
      border-color: rgba(199, 125, 255, 0.45);
    }
    .division-pill.active {
      background: linear-gradient(135deg, #581c87, #831843);
      border-color: #f43f5e;
      color: #fff;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.4);
    }

    /* Podium Cards */
    .podium-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .podium-card:hover {
      transform: translateY(-5px);
    }

    .podium-1 {
      border-color: rgba(230, 25, 75, 0.75);
      box-shadow: 0 0 35px rgba(230, 25, 75, 0.25);
      background: linear-gradient(180deg, rgba(45, 12, 35, 0.92) 0%, rgba(20, 8, 25, 0.95) 100%);
    }
    .podium-2 {
      border-color: rgba(199, 125, 255, 0.35);
    }
    .podium-3 {
      border-color: rgba(158, 11, 46, 0.35);
    }

    .podium-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #1f0b24;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    .podium-1 .podium-avatar { border-color: #ff4d6d; width: 92px; height: 92px; }
    .podium-2 .podium-avatar { border-color: #cbd5e1; }
    .podium-3 .podium-avatar { border-color: #c084fc; }

    .podium-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
    }

    .score-num {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2.3rem;
      font-weight: 700;
      line-height: 1;
    }

    /* Standings Table */
    .custom-table {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid rgba(255, 77, 109, 0.14);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .custom-table table {
      margin-bottom: 0;
    }
    .custom-table th {
      background: rgba(40, 10, 35, 0.6);
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 77, 109, 0.18);
      padding: 14px;
    }
    .custom-table td {
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding: 14px;
      vertical-align: middle;
    }
    .rank-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      background: rgba(255, 255, 255, 0.05);
    }
    .rank-1 { background: #ff4d6d; color: #fff; box-shadow: 0 0 10px rgba(255, 77, 109, 0.6); }
    .rank-2 { background: #cbd5e1; color: #000; }
    .rank-3 { background: #c084fc; color: #000; }

    .week-chip {
      display: inline-block;
      min-width: 28px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
    }
    .week-chip.gold { background: rgba(255, 77, 109, 0.25); color: #ff758f; border: 1px solid rgba(255, 77, 109, 0.4); }
    .week-chip.silver { background: rgba(203, 213, 225, 0.15); color: #cbd5e1; }
    .week-chip.bronze { background: rgba(192, 132, 252, 0.15); color: #d8b4fe; }

    /* Motion */
    .fade-content {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Minimal Speed Streaks & Embers Canvas -->
  <canvas id="speedCanvas"></canvas>

  <div class="content-wrapper">
    <!-- Top Navigation Link -->
    <div class="container pt-4">
      <a href="index.html" class="nav-back-btn">
        <i class="bi bi-arrow-left"></i> All-Time Standings
      </a>
    </div>

    <!-- Hero Header -->
    <div class="container py-4 text-center" data-aos="fade-down">
      <div class="sub-brand mb-1">🎃 October Sprint Classic</div>
      <h1 class="brand-title display-4 fw-bolder mb-2">PHANTOM SPRINT</h1>
      <p class="text-secondary small mb-4">Chukyo 1200m (W1-2) &bull; Nakayama 1200m (W3-4 Classic)</p>

      <!-- Server Toggle (JP vs EN) -->
      <div class="d-flex justify-content-center gap-2 mb-3">
        <button class="btn server-pill active" id="btnServerJP" onclick="switchServer('JP')">
          🇯🇵 JP Server
        </button>
        <button class="btn server-pill" id="btnServerEN" onclick="switchServer('EN')">
          🌐 EN Global
        </button>
      </div>

      <!-- Division Switcher Buttons -->
      <div class="d-flex justify-content-center gap-2 mt-2 flex-wrap">
        <button class="btn division-pill active" id="btnGraded" onclick="switchDivision('Graded')">
          <i class="bi bi-lightning-charge-fill me-2 text-danger"></i>Graded Division
        </button>
        <button class="btn division-pill" id="btnOpen" onclick="switchDivision('Open')">
          <i class="bi bi-shield-check me-2 text-info"></i><span id="openDivisionLabel">Open Division (UC Capped)</span>
        </button>
      </div>
    </div>

    <!-- Main Content Container -->
    <div class="container pb-5">

      <!-- Loading Spinner -->
      <div id="loadingIndicator" class="text-center py-5 d-none">
        <div class="spinner-border text-danger mb-2" role="status"></div>
        <div class="text-muted small">Loading Phantom Sprint results...</div>
      </div>

      <!-- Top 3 Podium -->
      <div class="row g-4 justify-content-center mb-5 align-items-end" id="podiumContainer" data-aos="fade-up">
        <!-- Generated Dynamically -->
      </div>

      <!-- Weekly Breakdown Table -->
      <div class="custom-table" data-aos="fade-up" data-aos-delay="100">
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead>
              <tr>
                <th class="text-center" style="width: 70px;">Rank</th>
                <th>Trainer</th>
                <th class="text-center">W1</th>
                <th class="text-center">W2</th>
                <th class="text-center">W3</th>
                <th class="text-center text-danger">W4 (2x)</th>
                <th class="text-center text-danger fw-bold">Total Pts</th>
                <th class="text-center">Wins</th>
                <th class="text-center">Podiums</th>
                <th class="text-center">Avg Pos</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Generated Dynamically -->
            </tbody>
          </table>
        </div>
      </div>
      
      <div class="text-center text-muted small mt-4">
        Week 4 awards 2x Points &bull; Auto-synced from Google Sheets
      </div>
    </div>
  </div>

  <!-- External Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  
  <script>
    AOS.init({ duration: 500, once: true });

    // ==========================================
    // Minimal Background Speed Particles Engine
    // ==========================================
    (function initSpeedParticles() {
      const canvas = document.getElementById('speedCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const particleCount = 45; // lightweight count for smooth 60fps

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class SpeedStreak {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.length = Math.random() * 60 + 20; // horizontal streak length
          this.speed = Math.random() * 3 + 1.2;
          this.opacity = Math.random() * 0.35 + 0.1;
          this.color = Math.random() > 0.4 ? '230, 25, 75' : '157, 78, 221'; // Crimson or Violet
          this.width = Math.random() * 1.5 + 0.5;
        }
        update() {
          this.x += this.speed * 1.5;
          if (this.x - this.length > width) {
            this.x = -this.length;
            this.y = Math.random() * height;
          }
        }
        draw() {
          ctx.beginPath();
          const gradient = ctx.createLinearGradient(this.x - this.length, this.y, this.x, this.y);
          gradient.addColorStop(0, `rgba(${this.color}, 0)`);
          gradient.addColorStop(1, `rgba(${this.color}, ${this.opacity})`);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = this.width;
          ctx.moveTo(this.x - this.length, this.y);
          ctx.lineTo(this.x, this.y);
          ctx.stroke();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new SpeedStreak());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let p of particles) {
          p.update();
          p.draw();
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ==========================================
    // Live Google Sheets Integration
    // ==========================================
    const SHEET_URLS = {
      JP: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbkE2wbV5LWkVIGXpJGdbSG9LxUopGIXMuOjyt5w0fkb3olKb6ueMyDWH3hFiS6tbdQfQv5VZdMct3/pub?gid=1767697908&single=true&output=csv",
      EN: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbkE2wbV5LWkVIGXpJGdbSG9LxUopGIXMuOjyt5w0fkb3olKb6ueMyDWH3hFiS6tbdQfQv5VZdMct3/pub?gid=1620695949&single=true&output=csv"
    };

    let currentServer = 'JP';
    let currentDivision = 'Graded';
    let currentEventData = [];

    function getFallbackAvatar(name) {
      return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name || 'Trainer')}`;
    }

    function getChipClass(points) {
      if (points >= 10) return 'gold';
      if (points === 6) return 'silver';
      if (points === 4) return 'bronze';
      return '';
    }

    function loadData() {
      const url = SHEET_URLS[currentServer];
      if (!url) return;

      const loader = document.getElementById('loadingIndicator');
      loader.classList.remove('d-none');

      Papa.parse(url, {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
          loader.classList.add('d-none');
          
          currentEventData = (results.data || [])
            .filter(row => row.Trainer && String(row.Trainer).trim() !== "")
            .map(row => {
              const pts = row.Total_Points !== undefined ? row.Total_Points : (row.Points !== undefined ? row.Points : 0);
              return {
                Trainer: String(row.Trainer).trim(),
                Division: String(row.Division || 'Graded').trim(),
                W1: Number(row.W1_Pts) || 0,
                W2: Number(row.W2_Pts) || 0,
                W3: Number(row.W3_Pts) || 0,
                W4: Number(row.W4_Classic_Pts) || 0,
                Points: Number(pts) || 0,
                Wins: Number(row.Wins) || 0,
                Podiums: Number(row.Podiums) || 0,
                Races: Number(row.Races) || 0,
                Avg_Pos: row.Avg_Pos !== undefined && row.Avg_Pos !== null && row.Avg_Pos !== "" && row.Avg_Pos !== 0 ? Number(row.Avg_Pos) : null,
                Avatar: (row.Avatar && String(row.Avatar).trim() !== "") ? String(row.Avatar).trim() : null
              };
            });

          render();
        },
        error: function(err) {
          loader.classList.add('d-none');
          console.error("Failed to load Google Sheet CSV:", err);
          render();
        }
      });
    }

    function switchServer(serverKey) {
      currentServer = serverKey;
      document.getElementById('btnServerJP').classList.toggle('active', serverKey === 'JP');
      document.getElementById('btnServerEN').classList.toggle('active', serverKey === 'EN');

      const openLabel = document.getElementById('openDivisionLabel');
      openLabel.innerText = serverKey === 'JP' ? "Open Division (UC Capped)" : "Open Division (A+ Capped)";

      loadData();
    }

    function switchDivision(div) {
      currentDivision = div;
      document.getElementById('btnGraded').classList.toggle('active', div === 'Graded');
      document.getElementById('btnOpen').classList.toggle('active', div === 'Open');
      render();
    }

    function render() {
      const container = document.getElementById('podiumContainer');
      const tableBody = document.getElementById('tableBody');

      // Sort by Points -> Wins -> Podiums -> Avg_Pos
      const filtered = currentEventData
        .filter(r => r.Division.toLowerCase() === currentDivision.toLowerCase())
        .sort((a, b) => {
          if (b.Points !== a.Points) return b.Points - a.Points;
          if (b.Wins !== a.Wins) return b.Wins - a.Wins;
          if (b.Podiums !== a.Podiums) return b.Podiums - a.Podiums;

          const avgA = a.Avg_Pos !== null ? a.Avg_Pos : 999;
          const avgB = b.Avg_Pos !== null ? b.Avg_Pos : 999;
          return avgA - avgB;
        });

      const top1 = filtered[0];
      const top2 = filtered[1];
      const top3 = filtered[2];

      container.className = "row g-4 justify-content-center mb-5 align-items-end fade-content";
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-4 text-muted">
            <i class="bi bi-flag fs-3 d-block mb-2"></i>
            No results logged for Phantom Sprint (${currentServer} ${currentDivision}) yet.
          </div>`;
      } else {
        container.innerHTML = `
          <!-- 2nd Place -->
          ${top2 ? `
          <div class="col-md-4 col-sm-6 order-2 order-md-1">
            <div class="podium-card podium-2 p-4 text-center">
              <span class="podium-badge bg-secondary mb-3 d-inline-block text-dark">2nd Place</span>
              <img src="${top2.Avatar || getFallbackAvatar(top2.Trainer)}" 
                   onerror="this.onerror=null; this.src='${getFallbackAvatar(top2.Trainer)}';" 
                   class="podium-avatar mb-3 d-block mx-auto shadow">
              <h5 class="fw-bold mb-1">${top2.Trainer}</h5>
              <div class="score-num text-light my-2">${top2.Points} <small class="fs-6 text-muted">pts</small></div>
              <div class="text-secondary small">${top2.Wins} wins &bull; ${top2.Podiums} podiums</div>
            </div>
          </div>` : ''}

          <!-- 1st Place -->
          ${top1 ? `
          <div class="col-md-4 col-sm-6 order-1 order-md-2">
            <div class="podium-card podium-1 p-4 pb-5 text-center">
              <span class="podium-badge bg-danger mb-3 d-inline-block text-white shadow"><i class="bi bi-fire me-1"></i> Sprint Leader</span>
              <img src="${top1.Avatar || getFallbackAvatar(top1.Trainer)}" 
                   onerror="this.onerror=null; this.src='${getFallbackAvatar(top1.Trainer)}';" 
                   class="podium-avatar mb-3 d-block mx-auto shadow-lg">
              <h4 class="fw-bold mb-1" style="color: #ff758f;">${top1.Trainer}</h4>
              <div class="score-num text-danger my-2">${top1.Points} <small class="fs-6 text-danger-emphasis">pts</small></div>
              <div class="text-secondary small">${top1.Wins} wins &bull; ${top1.Podiums} podiums</div>
            </div>
          </div>` : ''}

          <!-- 3rd Place -->
          ${top3 ? `
          <div class="col-md-4 col-sm-6 order-3 order-md-3">
            <div class="podium-card podium-3 p-4 text-center">
              <span class="podium-badge bg-dark border border-secondary mb-3 d-inline-block text-light">3rd Place</span>
              <img src="${top3.Avatar || getFallbackAvatar(top3.Trainer)}" 
                   onerror="this.onerror=null; this.src='${getFallbackAvatar(top3.Trainer)}';" 
                   class="podium-avatar mb-3 d-block mx-auto shadow">
              <h5 class="fw-bold mb-1">${top3.Trainer}</h5>
              <div class="score-num text-light my-2">${top3.Points} <small class="fs-6 text-muted">pts</small></div>
              <div class="text-secondary small">${top3.Wins} wins &bull; ${top3.Podiums} podiums</div>
            </div>
          </div>` : ''}
        `;
      }

      // Table Rows
      tableBody.className = "fade-content";
      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="10" class="text-center py-4 text-muted">Waiting for race results.</td>
          </tr>`;
      } else {
        tableBody.innerHTML = filtered.map((row, index) => {
          const rank = index + 1;
          const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
          return `
            <tr>
              <td class="text-center">
                <span class="rank-circle ${rankClass}">${rank}</span>
              </td>
              <td>
                <div class="d-flex align-items-center gap-3">
                  <img src="${row.Avatar || getFallbackAvatar(row.Trainer)}" 
                       onerror="this.onerror=null; this.src='${getFallbackAvatar(row.Trainer)}';" 
                       width="34" height="34" class="rounded-circle" style="object-fit: cover; background: #1f0b24;">
                  <span class="fw-bold">${row.Trainer}</span>
                </div>
              </td>
              <td class="text-center"><span class="week-chip ${getChipClass(row.W1)}">${row.W1 || '-'}</span></td>
              <td class="text-center"><span class="week-chip ${getChipClass(row.W2)}">${row.W2 || '-'}</span></td>
              <td class="text-center"><span class="week-chip ${getChipClass(row.W3)}">${row.W3 || '-'}</span></td>
              <td class="text-center"><span class="week-chip ${getChipClass(row.W4)} text-danger fw-bold">${row.W4 ? (row.W4 * 2) : '-'}</span></td>
              <td class="text-center fw-bold text-danger fs-5">${row.Points}</td>
              <td class="text-center text-secondary">${row.Wins}</td>
              <td class="text-center text-secondary">${row.Podiums}</td>
              <td class="text-center text-secondary">${row.Avg_Pos !== null ? row.Avg_Pos.toFixed(2) : '-'}</td>
            </tr>
          `;
        }).join('');
      }
    }

    loadData();
  </script>
</body>
</html>
